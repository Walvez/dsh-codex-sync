name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install deps (cordis/react/react-dom for the host+client suites)
        run: npm ci
      - name: Test suite (reader + host smoke + client render; hermetic, no dsh install needed)
        run: npm test
      - name: CLI smoke
        run: node bin/dsh-codex-sync.js --help
